apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

android {
    signingConfigs {
        release {
            def keystoreFile = localProperties.getProperty("KEYSTORE_FILE") ?: System.getenv("KEYSTORE_FILE")
            def keystorePass = localProperties.getProperty("KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            def keyAliasName = localProperties.getProperty("KEY_ALIAS") ?: System.getenv("KEY_ALIAS")
            def keyPass = localProperties.getProperty("KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD")

            if (keystoreFile != null && keystorePass != null) {
                storeFile file("${rootProject.projectDir}/$keystoreFile")
                storePassword keystorePass
                keyAlias = keyAliasName ?: "reality_key"
                keyPassword = keyPass ?: keystorePass
            }
        }
    }
    ndkVersion project.properties['de.felixnuesse.extract.ndkVersion']
    defaultConfig {
        generatedDensities = []
        vectorDrawables.generatedDensities = []
        applicationId 'rm.neubofy.in'
        minSdkVersion 31
        compileSdk 35
        targetSdkVersion 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "java.lang.String", "CLI", System.getenv('RCX_BUILD_CLI') ? System.getenv('RCX_BUILD_CLI') : "\"c03129b6-b09f-9cb4-8fcd-7f143b8f94ef\""
        buildConfigField "java.lang.String", "VCP_AUTHORITY", "\"" + applicationId + ".vcp\"";
        buildConfigField "long", "BUILD_TIMESTAMP", "${System.currentTimeMillis()}L"
        buildConfigField "java.lang.String", "RCLONE_VERSION", "\"" + (project.findProperty('de.felixnuesse.extract.rCloneVersion') ?: 'unknown') + "\""
        setProperty("archivesBaseName",  "RemoteManager_v" + versionName + "_" + System.currentTimeMillis())

        externalNativeBuild {
            ndkBuild {
                arguments "LOCAL_LDFLAGS += -Wl,--build-id=none"
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher",
                    appIconRound: "@mipmap/ic_launcher_round"
            ]
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
            buildConfigField "java.lang.String", "VCP_AUTHORITY", "\"rm.neubofy.in.debug.vcp\"";
            resValue("string", "app_name", "Remote Manager (Debug)")
            resValue("string", "app_short_name", "Remote Manager")
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    appIcon: "@mipmap/ic_launcher",
                    appIconRound: "@mipmap/ic_launcher_round"
            ]
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def timestamp = defaultConfig.buildConfigFields["BUILD_TIMESTAMP"]?.value?.replace("L", "") ?: ""
            output.outputFileName = "Remote-Manager-v${variant.versionName}-${timestamp}-${variant.buildType.name}.apk"
        }
    }

    sourceSets {
        configureEach {
            jniLibs.srcDirs = ["lib"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
            useLegacyPackaging true
        }
    }

    // Required for language picker
    androidResources {
        generateLocaleConfig true
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = false
        warning 'MissingTranslation'
    }

    gradle.projectsEvaluated {
        def isCI = System.getenv("CI") != null
        def hasGo = false
        try {
            def process = "go version".execute()
            process.waitFor()
            hasGo = (process.exitValue() == 0)
        } catch (Exception ignored) {}

        if (isCI || hasGo) {
            preBuild.dependsOn(':rclone:buildAll')
        }
    }

    namespace 'ca.pkay.rcloneexplorer'

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'org.markdownj:markdownj-core:0.4'
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'
    implementation 'com.github.GrenderG:Toasty:1.5.2'

    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")

    // Background Work
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'io.coil-kt:coil:2.5.0'
    // REST Client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'com.squareup.okhttp3:logging-interceptor:4.9.1'
    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-core:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.14.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.1'
    // Timestamps
    implementation 'com.github.x0b:rfc3339parser:2.0.0'
    // SAF/WebDAV
    implementation project(':safdav')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // App intro
    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    // TEST
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Splash screen
    implementation("androidx.core:core-splashscreen:1.0.1")

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // App Updater (matching Watch app)
    implementation 'io.github.azhon:appupdate:4.3.6'
}
