MaintainerNotes: |
  Match the upstream OSS universal APK with normal ABI splits enabled. The Go
  1.26.0 archive SHA-256 comes from https://go.dev/dl/?mode=json&include=all.
  The official Gradle 8.13 asset API is used to avoid repeated HTTP 504s on
  GitHub's browser-download redirect. The immutable distribution SHA-256 is
  verified before populating vagrant's wrapper and gradlew-fdroid caches;
  both original launchers independently verify the exact same distribution.
  The compiler is provisioned outside the application source tree. JDK 17 is
  selected explicitly because the current CI image defaults to JDK 21.
  The app and pinned rclone checkout must retain Git metadata: the app embeds
  its source revision and the offline native build verifies rclone's clean SHA.
  Keep Binaries and AllowedAPKSigningKeys: developer-signed distribution only.
  Version 1.0.6 uses the pinned nogui-enabled rclone fork and native build tag.
  The helper requires cmd/gui to be absent from every production ABI graph
  under noselfupdate,nogui, then protects all actual Go sources and embeds
  before removing the explicitly listed dependency fixtures/language bindings.
  Rclone's tracked test fixtures are narrowly ignored to retain source SHA
  cleanliness. The GUI archive exception is valid only when the production
  graph assertion confirms it is uncompiled. The two x/net publicsuffix files
  are non-executable generated suffix lookup tables required by production.
  Updates are manual until initial packaging has been reviewed and accepted.

